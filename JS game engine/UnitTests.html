<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Unit Tests</title>
	<style>
		body {
			font-family: 'Courier New', monospace;
			padding: 20px;
			background: #1e1e1e;
			color: #d4d4d4;
		}
		h1 {
			color: #4ec9b0;
		}
		.test-results {
			margin-top: 20px;
		}
		.test-group {
			margin: 15px 0;
			border-left: 3px solid #569cd6;
			padding-left: 15px;
		}
		.test-group h2 {
			color: #569cd6;
			font-size: 18px;
			margin: 5px 0;
		}
		.test-case {
			margin: 5px 0;
			padding: 5px;
		}
		.test-case.pass {
			color: #4ec9b0;
		}
		.test-case.pass::before {
			content: "✓ ";
			font-weight: bold;
		}
		.test-case.fail {
			color: #f48771;
			background: rgba(244, 135, 113, 0.1);
			padding: 8px;
			border-radius: 3px;
		}
		.test-case.fail::before {
			content: "✗ ";
			font-weight: bold;
		}
		.error-details {
			margin-left: 20px;
			font-size: 12px;
			color: #ce9178;
		}
		.summary {
			margin-top: 30px;
			padding: 15px;
			background: #252526;
			border-radius: 5px;
			font-size: 16px;
		}
		.summary.success {
			border-left: 5px solid #4ec9b0;
		}
		.summary.failure {
			border-left: 5px solid #f48771;
		}
	</style>
</head>
<body>
	<h1>Unit Test Suite</h1>
	<div id="results" class="test-results"></div>

	<script type="module">
		import { CollisionDetection } from './VibeEngine/CollisionDetection.js';
		import { Vector2D } from './VibeEngine/Vector2D.js';
		import { EntityManager } from './VibeEngine/EntityManager.js?v=2';
		import { Camera } from './VibeEngine/Camera.js';
		import { Sprite } from './VibeEngine/Sprite.js';
		import { Entity } from './VibeEngine/Entity.js';
		import { Particle } from './VibeEngine/Particle.js';
		import { ParticleSystem } from './VibeEngine/ParticleSystem.js';
		import { Projectile } from './VibeEngine/Projectile.js';
		import { SpawnSystem } from './SpawnSystem.js';

		// Signal that modules are loaded
		window.CollisionDetection = CollisionDetection;
		window.Vector2D = Vector2D;
		window.EntityManager = EntityManager;
		window.Camera = Camera;
		window.Sprite = Sprite;
		window.Entity = Entity;
		window.Particle = Particle;
		window.ParticleSystem = ParticleSystem;
		window.Projectile = Projectile;
		window.SpawnSystem = SpawnSystem;
		window.modulesLoaded = true;

		// Trigger test execution
		window.dispatchEvent(new Event('modulesReady'));
	</script>

	<script defer>
		// Simple test framework
		class TestRunner {
			constructor() {
				this.results = [];
				this.currentGroup = null;
			}

			describe(groupName, testFn) {
				this.currentGroup = groupName;
				testFn();
				this.currentGroup = null;
			}

			it(testName, testFn) {
				try {
					testFn();
					this.results.push({
						group: this.currentGroup,
						name: testName,
						passed: true
					});
				} catch (error) {
					this.results.push({
						group: this.currentGroup,
						name: testName,
						passed: false,
						error: error.message
					});
				}
			}

			assertEqual(actual, expected, message = '') {
				if (actual !== expected) {
					throw new Error(`Expected ${expected}, got ${actual}. ${message}`);
				}
			}

			assertAlmostEqual(actual, expected, epsilon = 0.0001, message = '') {
				if (Math.abs(actual - expected) > epsilon) {
					throw new Error(`Expected ${expected}, got ${actual} (diff: ${Math.abs(actual - expected)}). ${message}`);
				}
			}

			assertTrue(condition, message = '') {
				if (!condition) {
					throw new Error(`Expected true, got false. ${message}`);
				}
			}

			assertFalse(condition, message = '') {
				if (condition) {
					throw new Error(`Expected false, got true. ${message}`);
				}
			}

			assertThrows(fn, message = '') {
				try {
					fn();
					throw new Error(`Expected function to throw an error. ${message}`);
				} catch (error) {
					// Expected
				}
			}

			render() {
				const resultsDiv = document.getElementById('results');
				const groups = {};

				// Group results
				this.results.forEach(result => {
					if (!groups[result.group]) {
						groups[result.group] = [];
					}
					groups[result.group].push(result);
				});

				// Render groups
				Object.keys(groups).forEach(groupName => {
					const groupDiv = document.createElement('div');
					groupDiv.className = 'test-group';

					const groupTitle = document.createElement('h2');
					groupTitle.textContent = groupName;
					groupDiv.appendChild(groupTitle);

					groups[groupName].forEach(result => {
						const testDiv = document.createElement('div');
						testDiv.className = `test-case ${result.passed ? 'pass' : 'fail'}`;
						testDiv.textContent = result.name;

						if (!result.passed) {
							const errorDiv = document.createElement('div');
							errorDiv.className = 'error-details';
							errorDiv.textContent = result.error;
							testDiv.appendChild(errorDiv);
						}

						groupDiv.appendChild(testDiv);
					});

					resultsDiv.appendChild(groupDiv);
				});

				// Summary
				const passed = this.results.filter(r => r.passed).length;
				const failed = this.results.filter(r => !r.passed).length;
				const total = this.results.length;

				const summaryDiv = document.createElement('div');
				summaryDiv.className = `summary ${failed === 0 ? 'success' : 'failure'}`;
				summaryDiv.innerHTML = `
					<strong>Test Summary:</strong><br>
					Total: ${total} | Passed: ${passed} | Failed: ${failed}
				`;
				resultsDiv.appendChild(summaryDiv);
			}
		}

		// Wait for modules to load before running tests
		function runAllTests() {
			// Check if modules are loaded
			if (!window.CollisionDetection || !window.Vector2D || !window.EntityManager ||
			    !window.Camera || !window.Sprite || !window.Entity ||
			    !window.Particle || !window.ParticleSystem || !window.Projectile || !window.SpawnSystem) {
				console.error('Modules not loaded yet');
				return;
			}

			const runner = new TestRunner();

			// Constructor tests
			runner.describe('Vector2D Constructor', () => {
			runner.it('should create vector with default values (0, 0)', () => {
				const v = new Vector2D();
				runner.assertEqual(v.x, 0);
				runner.assertEqual(v.y, 0);
			});

			runner.it('should create vector with custom values', () => {
				const v = new Vector2D(3, 4);
				runner.assertEqual(v.x, 3);
				runner.assertEqual(v.y, 4);
			});

			runner.it('should handle negative values', () => {
				const v = new Vector2D(-5, -12);
				runner.assertEqual(v.x, -5);
				runner.assertEqual(v.y, -12);
			});
		});

		// fromRadial tests
		runner.describe('Vector2D.fromRadial()', () => {
			runner.it('should create vector from angle 0 (pointing up)', () => {
				const v = Vector2D.fromRadial(0, 1);
				runner.assertAlmostEqual(v.x, 0);
				runner.assertAlmostEqual(v.y, -1); // Negative because canvas Y increases downward
			});

			runner.it('should create vector from angle PI/2 (pointing right)', () => {
				const v = Vector2D.fromRadial(Math.PI / 2, 1);
				runner.assertAlmostEqual(v.x, 1);
				runner.assertAlmostEqual(v.y, 0);
			});

			runner.it('should scale by radius', () => {
				const v = Vector2D.fromRadial(Math.PI / 2, 5);
				runner.assertAlmostEqual(v.x, 5);
				runner.assertAlmostEqual(v.y, 0);
			});
		});

		// Addition tests
		runner.describe('Vector2D.add()', () => {
			runner.it('should add two vectors correctly', () => {
				const v1 = new Vector2D(1, 2);
				const v2 = new Vector2D(3, 4);
				const result = v1.add(v2);
				runner.assertEqual(result.x, 4);
				runner.assertEqual(result.y, 6);
			});

			runner.it('should not mutate original vector', () => {
				const v1 = new Vector2D(1, 2);
				const v2 = new Vector2D(3, 4);
				v1.add(v2);
				runner.assertEqual(v1.x, 1);
				runner.assertEqual(v1.y, 2);
			});

			runner.it('should handle negative values', () => {
				const v1 = new Vector2D(5, 3);
				const v2 = new Vector2D(-2, -7);
				const result = v1.add(v2);
				runner.assertEqual(result.x, 3);
				runner.assertEqual(result.y, -4);
			});
		});

		// Subtraction tests
		runner.describe('Vector2D.sub()', () => {
			runner.it('should subtract two vectors correctly', () => {
				const v1 = new Vector2D(5, 7);
				const v2 = new Vector2D(2, 3);
				const result = v1.sub(v2);
				runner.assertEqual(result.x, 3);
				runner.assertEqual(result.y, 4);
			});

			runner.it('should not mutate original vector', () => {
				const v1 = new Vector2D(5, 7);
				const v2 = new Vector2D(2, 3);
				v1.sub(v2);
				runner.assertEqual(v1.x, 5);
				runner.assertEqual(v1.y, 7);
			});
		});

		// Multiplication tests
		runner.describe('Vector2D.mul()', () => {
			runner.it('should multiply vector by scalar', () => {
				const v = new Vector2D(3, 4);
				const result = v.mul(2);
				runner.assertEqual(result.x, 6);
				runner.assertEqual(result.y, 8);
			});

			runner.it('should handle zero multiplication', () => {
				const v = new Vector2D(3, 4);
				const result = v.mul(0);
				runner.assertEqual(result.x, 0);
				runner.assertEqual(result.y, 0);
			});

			runner.it('should handle negative scalar', () => {
				const v = new Vector2D(3, 4);
				const result = v.mul(-1);
				runner.assertEqual(result.x, -3);
				runner.assertEqual(result.y, -4);
			});
		});

		// Division tests
		runner.describe('Vector2D.div()', () => {
			runner.it('should divide vector by scalar', () => {
				const v = new Vector2D(6, 8);
				const result = v.div(2);
				runner.assertEqual(result.x, 3);
				runner.assertEqual(result.y, 4);
			});

			runner.it('should handle division by negative', () => {
				const v = new Vector2D(6, 8);
				const result = v.div(-2);
				runner.assertEqual(result.x, -3);
				runner.assertEqual(result.y, -4);
			});

			runner.it('should produce Infinity when dividing by zero', () => {
				const v = new Vector2D(6, 8);
				const result = v.div(0);
				runner.assertTrue(result.x === Infinity);
				runner.assertTrue(result.y === Infinity);
			});
		});

		// Dot product tests
		runner.describe('Vector2D.dot()', () => {
			runner.it('should calculate dot product correctly', () => {
				const v1 = new Vector2D(2, 3);
				const v2 = new Vector2D(4, 5);
				const result = v1.dot(v2);
				runner.assertEqual(result, 23); // 2*4 + 3*5 = 8 + 15 = 23
			});

			runner.it('should be zero for perpendicular vectors', () => {
				const v1 = new Vector2D(1, 0);
				const v2 = new Vector2D(0, 1);
				const result = v1.dot(v2);
				runner.assertEqual(result, 0);
			});
		});

		// Cross product tests
		runner.describe('Vector2D.cross()', () => {
			runner.it('should calculate 2D cross product correctly', () => {
				const v1 = new Vector2D(2, 3);
				const v2 = new Vector2D(4, 5);
				const result = v1.cross(v2);
				runner.assertEqual(result, -2); // 2*5 - 3*4 = 10 - 12 = -2
			});

			runner.it('should be zero for parallel vectors', () => {
				const v1 = new Vector2D(2, 4);
				const v2 = new Vector2D(1, 2);
				const result = v1.cross(v2);
				runner.assertEqual(result, 0);
			});
		});

		// Magnitude tests
		runner.describe('Vector2D.mag()', () => {
			runner.it('should calculate magnitude correctly', () => {
				const v = new Vector2D(3, 4);
				const result = v.mag();
				runner.assertEqual(result, 5); // 3-4-5 triangle
			});

			runner.it('should return 0 for zero vector', () => {
				const v = new Vector2D(0, 0);
				const result = v.mag();
				runner.assertEqual(result, 0);
			});

			runner.it('should handle negative components', () => {
				const v = new Vector2D(-3, -4);
				const result = v.mag();
				runner.assertEqual(result, 5);
			});
		});

		// Magnitude squared tests
		runner.describe('Vector2D.magSq()', () => {
			runner.it('should calculate squared magnitude correctly', () => {
				const v = new Vector2D(3, 4);
				const result = v.magSq();
				runner.assertEqual(result, 25); // 3^2 + 4^2 = 9 + 16 = 25
			});

			runner.it('should be more efficient than mag() squared', () => {
				const v = new Vector2D(5, 12);
				const magSq = v.magSq();
				const magSquared = v.mag() * v.mag();
				runner.assertEqual(magSq, magSquared);
			});
		});

		// Normalization tests (CRITICAL - includes division by zero fix)
		runner.describe('Vector2D.norm()', () => {
			runner.it('should normalize vector to unit length', () => {
				const v = new Vector2D(3, 4);
				const result = v.norm();
				runner.assertAlmostEqual(result.mag(), 1.0);
			});

			runner.it('should preserve direction', () => {
				const v = new Vector2D(3, 4);
				const result = v.norm();
				runner.assertAlmostEqual(result.x, 0.6);
				runner.assertAlmostEqual(result.y, 0.8);
			});

			runner.it('should handle ZERO VECTOR without dividing by zero (CRITICAL BUG FIX)', () => {
				const v = new Vector2D(0, 0);
				const result = v.norm();
				runner.assertEqual(result.x, 0);
				runner.assertEqual(result.y, 0);
				runner.assertFalse(isNaN(result.x), 'Result should not be NaN');
				runner.assertFalse(isNaN(result.y), 'Result should not be NaN');
			});

			runner.it('should not mutate original vector', () => {
				const v = new Vector2D(3, 4);
				v.norm();
				runner.assertEqual(v.x, 3);
				runner.assertEqual(v.y, 4);
			});
		});

		// Distance tests
		runner.describe('Vector2D.dist()', () => {
			runner.it('should calculate distance between two vectors', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(3, 4);
				const result = v1.dist(v2);
				runner.assertEqual(result, 5);
			});

			runner.it('should be symmetric', () => {
				const v1 = new Vector2D(1, 2);
				const v2 = new Vector2D(4, 6);
				runner.assertEqual(v1.dist(v2), v2.dist(v1));
			});

			runner.it('should return 0 for same vector', () => {
				const v = new Vector2D(3, 4);
				const result = v.dist(v);
				runner.assertEqual(result, 0);
			});
		});

		// Distance squared tests
		runner.describe('Vector2D.distSq()', () => {
			runner.it('should calculate squared distance between vectors', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(3, 4);
				const result = v1.distSq(v2);
				runner.assertEqual(result, 25);
			});
		});

		// Angle tests
		runner.describe('Vector2D.angle()', () => {
			runner.it('should return angle for vector pointing right', () => {
				const v = new Vector2D(1, 0);
				const result = v.angle();
				runner.assertEqual(result, 0);
			});

			runner.it('should return PI/2 for vector pointing down', () => {
				const v = new Vector2D(0, 1);
				const result = v.angle();
				runner.assertAlmostEqual(result, Math.PI / 2);
			});

			runner.it('should return -PI/2 for vector pointing up', () => {
				const v = new Vector2D(0, -1);
				const result = v.angle();
				runner.assertAlmostEqual(result, -Math.PI / 2);
			});
		});

		// Angle to tests
		runner.describe('Vector2D.angleTo()', () => {
			runner.it('should calculate angle from one vector to another', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(1, 0);
				const result = v1.angleTo(v2);
				runner.assertEqual(result, 0);
			});

			runner.it('should handle diagonal angles', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(1, 1);
				const result = v1.angleTo(v2);
				runner.assertAlmostEqual(result, Math.PI / 4); // 45 degrees
			});
		});

		// Rotation tests
		runner.describe('Vector2D.rotate()', () => {
			runner.it('should rotate vector by 90 degrees', () => {
				const v = new Vector2D(1, 0);
				const result = v.rotate(Math.PI / 2);
				runner.assertAlmostEqual(result.x, 0);
				runner.assertAlmostEqual(result.y, 1);
			});

			runner.it('should rotate vector by 180 degrees', () => {
				const v = new Vector2D(1, 0);
				const result = v.rotate(Math.PI);
				runner.assertAlmostEqual(result.x, -1);
				runner.assertAlmostEqual(result.y, 0);
			});

			runner.it('should not mutate original vector', () => {
				const v = new Vector2D(1, 0);
				v.rotate(Math.PI / 2);
				runner.assertEqual(v.x, 1);
				runner.assertEqual(v.y, 0);
			});
		});

		// Rotate around tests
		runner.describe('Vector2D.rotateAround()', () => {
			runner.it('should rotate around a point', () => {
				const v = new Vector2D(2, 0);
				const center = new Vector2D(1, 0);
				const result = v.rotateAround(center, Math.PI / 2);
				runner.assertAlmostEqual(result.x, 1);
				runner.assertAlmostEqual(result.y, 1);
			});

			runner.it('should not change position when rotating around itself', () => {
				const v = new Vector2D(3, 4);
				const result = v.rotateAround(v, Math.PI);
				runner.assertAlmostEqual(result.x, 3);
				runner.assertAlmostEqual(result.y, 4);
			});
		});

		// Linear interpolation tests
		runner.describe('Vector2D.lerp()', () => {
			runner.it('should return start vector when t=0', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(10, 10);
				const result = v1.lerp(v2, 0);
				runner.assertEqual(result.x, 0);
				runner.assertEqual(result.y, 0);
			});

			runner.it('should return end vector when t=1', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(10, 10);
				const result = v1.lerp(v2, 1);
				runner.assertEqual(result.x, 10);
				runner.assertEqual(result.y, 10);
			});

			runner.it('should interpolate halfway when t=0.5', () => {
				const v1 = new Vector2D(0, 0);
				const v2 = new Vector2D(10, 10);
				const result = v1.lerp(v2, 0.5);
				runner.assertEqual(result.x, 5);
				runner.assertEqual(result.y, 5);
			});

			runner.it('should handle non-uniform vectors', () => {
				const v1 = new Vector2D(2, 8);
				const v2 = new Vector2D(6, 4);
				const result = v1.lerp(v2, 0.25);
				runner.assertEqual(result.x, 3);
				runner.assertEqual(result.y, 7);
			});
		});

		// Equality tests
		runner.describe('Vector2D.equals()', () => {
			runner.it('should return true for equal vectors', () => {
				const v1 = new Vector2D(3, 4);
				const v2 = new Vector2D(3, 4);
				runner.assertTrue(v1.equals(v2));
			});

			runner.it('should return false for different vectors', () => {
				const v1 = new Vector2D(3, 4);
				const v2 = new Vector2D(3, 5);
				runner.assertFalse(v1.equals(v2));
			});

			runner.it('should return true for same vector instance', () => {
				const v = new Vector2D(3, 4);
				runner.assertTrue(v.equals(v));
			});

			runner.it('should use strict equality (not type coercion)', () => {
				const v1 = new Vector2D(3, 4);
				const v2 = new Vector2D(3, 4);
				// This test verifies the fix from == to ===
				runner.assertTrue(v1.equals(v2));
			});
		});

		// toString tests
		runner.describe('Vector2D.toString()', () => {
			runner.it('should convert to string format', () => {
				const v = new Vector2D(3, 4);
				const result = v.toString();
				runner.assertEqual(result, '(3, 4)');
			});

			runner.it('should handle negative values', () => {
				const v = new Vector2D(-5, -12);
				const result = v.toString();
				runner.assertEqual(result, '(-5, -12)');
			});

			runner.it('should handle decimals', () => {
				const v = new Vector2D(3.14, 2.71);
				const result = v.toString();
				runner.assertEqual(result, '(3.14, 2.71)');
			});
		});

		// Edge cases and integration tests
		runner.describe('Vector2D Edge Cases', () => {
			runner.it('should handle very large numbers', () => {
				const v = new Vector2D(1e10, 1e10);
				const result = v.add(new Vector2D(1e10, 1e10));
				runner.assertEqual(result.x, 2e10);
				runner.assertEqual(result.y, 2e10);
			});

			runner.it('should handle very small numbers', () => {
				const v = new Vector2D(1e-10, 1e-10);
				const result = v.mul(2);
				runner.assertAlmostEqual(result.x, 2e-10);
				runner.assertAlmostEqual(result.y, 2e-10);
			});

			runner.it('should chain operations correctly', () => {
				const v = new Vector2D(1, 2);
				const result = v.add(new Vector2D(1, 1))
					.mul(2)
					.sub(new Vector2D(1, 1))
					.div(2);
				runner.assertAlmostEqual(result.x, 1.5);
				runner.assertAlmostEqual(result.y, 2.5);
			});
		});

		// ====================
		// CollisionDetection Tests
		// ====================

		// Helper functions to create mock entities
		function createAABBEntity(x, y, width, height) {
			return {
				sprite: {
					position: new Vector2D(x, y),
					size: new Vector2D(width, height),
					rotation: 0
				}
			};
		}

		function createCircleEntity(x, y, radius) {
			return {
				position: new Vector2D(x, y),
				size: new Vector2D(radius * 2, radius * 2)
			};
		}

		function createPolygonEntity(x, y, width, height, polygon, rotation = 0) {
			return {
				sprite: {
					position: new Vector2D(x, y),
					size: new Vector2D(width, height),
					rotation: rotation
				},
				collisionPolygon: polygon
			};

				);

				particle.update(500);
				runner.assertTrue(particle.isDead());
			});
		});

		runner.describe('Particle - Movement and Physics', () => {
			runner.it('should update position based on velocity', () => {
				const particle = new window.Particle(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 0.5),
					1000, "255,255,255", 5
				);

				particle.update(100);

				// Position should be updated by velocity * deltaTime
				runner.assertAlmostEqual(particle.position.x, 100, 0.1);
				runner.assertAlmostEqual(particle.position.y, 50, 0.1);
			});

			runner.it('should apply friction to slow down', () => {
				const particle = new window.Particle(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 0),
					1000, "255,255,255", 5
				);

				const initialSpeed = particle.velocity.mag();
				particle.update(100);
				const speedAfterUpdate = particle.velocity.mag();

				runner.assertTrue(speedAfterUpdate < initialSpeed, 'Velocity should decrease due to friction');
			});

			runner.it('should continue slowing down over multiple updates', () => {
				const particle = new window.Particle(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 0),
					1000, "255,255,255", 5
				);

				const speeds = [];
				for (let i = 0; i < 5; i++) {
					speeds.push(particle.velocity.mag());
					particle.update(10);
				}

				// Each speed should be less than the previous
				for (let i = 1; i < speeds.length; i++) {
					runner.assertTrue(speeds[i] < speeds[i-1], 'Speed should decrease each update');
				}
			});
		});

		// ParticleSystem Tests
		runner.describe('ParticleSystem - Constructor', () => {
			runner.it('should create empty particle system', () => {
				const system = new window.ParticleSystem();
				runner.assertTrue(Array.isArray(system.particles));
				runner.assertEqual(system.particles.length, 0);
			});
		});

		runner.describe('ParticleSystem - Impact Spawning', () => {
			runner.it('should spawn impact particles', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				runner.assertTrue(system.particles.length > 0);
			});

			runner.it('should spawn correct number of impact particles', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				runner.assertEqual(system.particles.length, 8);
			});

			runner.it('should spawn particles at correct position', () => {
				const system = new window.ParticleSystem();
				const pos = new window.Vector2D(100, 200);
				system.spawnImpact(pos);

				// All particles should start at the impact position
				for (const particle of system.particles) {
					runner.assertAlmostEqual(particle.position.x, pos.x, 0.01);
					runner.assertAlmostEqual(particle.position.y, pos.y, 0.01);
				}
			});

			runner.it('should spawn particles with different velocities', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				// Check that velocities are different (evenly distributed in circle)
				const angles = system.particles.map(p =>
					Math.atan2(p.velocity.y, p.velocity.x)
				);

				// All angles should be different
				const uniqueAngles = new Set(angles.map(a => a.toFixed(3)));
				runner.assertEqual(uniqueAngles.size, system.particles.length);
			});
		});

		runner.describe('ParticleSystem - Explosion Spawning', () => {
			runner.it('should spawn explosion particles', () => {
				const system = new window.ParticleSystem();
				const params = {
					particleCount: 20,
					minSpeed: 0.1,
					maxSpeed: 0.3,
					lifetime: 500,
					minSize: 2,
					maxSize: 5
				};
				system.spawnExplosion(new window.Vector2D(100, 200), "255,100,50", params);

				runner.assertEqual(system.particles.length, 20);
			});

			runner.it('should spawn particles with varying sizes', () => {
				const system = new window.ParticleSystem();
				const params = {
					particleCount: 20,
					minSpeed: 0.1,
					maxSpeed: 0.3,
					lifetime: 500,
					minSize: 2,
					maxSize: 10
				};
				system.spawnExplosion(new window.Vector2D(100, 200), "255,100,50", params);

				const sizes = system.particles.map(p => p.size);
				const minSize = Math.min(...sizes);
				const maxSize = Math.max(...sizes);

				runner.assertTrue(minSize >= 2);
				runner.assertTrue(maxSize <= 10);
				runner.assertTrue(maxSize > minSize, 'Should have size variation');
			});
		});

		runner.describe('ParticleSystem - Update and Cleanup', () => {
			runner.it('should update all particles', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				const initialAges = system.particles.map(p => p.age);
				system.update(100);
				const updatedAges = system.particles.map(p => p.age);

				for (let i = 0; i < initialAges.length; i++) {
					runner.assertTrue(updatedAges[i] > initialAges[i]);
				}
			});

			runner.it('should remove dead particles', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				// Update past particle lifetime
				system.update(1000);

				runner.assertEqual(system.particles.length, 0, 'All particles should be removed');
			});

			runner.it('should keep alive particles', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				// Update for short time
				system.update(50);

				runner.assertTrue(system.particles.length > 0, 'Particles should still be alive');
			});

			runner.it('should clear all particles', () => {
				const system = new window.ParticleSystem();
				system.spawnImpact(new window.Vector2D(100, 200));

				system.clear();
				runner.assertEqual(system.particles.length, 0);
			});
		});

		// Projectile Tests
		runner.describe('Projectile - Constructor', () => {
			runner.it('should create projectile with correct properties', () => {
				const pos = new window.Vector2D(100, 200);
				const vel = new window.Vector2D(1, 0);
				const size = new window.Vector2D(10, 20);
				const damage = 25;

				const projectile = new window.Projectile(pos, vel, 'bullet.png', size, damage);

				runner.assertEqual(projectile.sprite.position, pos);
				runner.assertEqual(projectile.velocity, vel);
				runner.assertEqual(projectile.damage, damage);
				runner.assertEqual(projectile.sprite.size, size);
			});

			runner.it('should set rotation to face direction of travel', () => {
				// Moving right (positive x)
				const projectile = new window.Projectile(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 0),
					'bullet.png',
					new window.Vector2D(10, 10),
					10
				);

				// Rotation should be Math.atan2(0, 1) + PI/2 = 0 + PI/2
				runner.assertAlmostEqual(projectile.sprite.rotation, Math.PI / 2, 0.01);
			});

			runner.it('should handle diagonal velocity rotation', () => {
				// Moving diagonally (45 degrees)
				const projectile = new window.Projectile(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 1),
					'bullet.png',
					new window.Vector2D(10, 10),
					10
				);

				// Rotation should be Math.atan2(1, 1) + PI/2 = PI/4 + PI/2
				const expectedRotation = Math.atan2(1, 1) + Math.PI / 2;
				runner.assertAlmostEqual(projectile.sprite.rotation, expectedRotation, 0.01);
			});
		});

		runner.describe('Projectile - Movement', () => {
			runner.it('should update position based on velocity', () => {
				const projectile = new window.Projectile(
					new window.Vector2D(0, 0),
					new window.Vector2D(5, 3),
					'bullet.png',
					new window.Vector2D(10, 10),
					10
				);

				projectile.update();

				runner.assertAlmostEqual(projectile.sprite.position.x, 5, 0.01);
				runner.assertAlmostEqual(projectile.sprite.position.y, 3, 0.01);
			});

			runner.it('should accumulate movement over multiple updates', () => {
				const projectile = new window.Projectile(
					new window.Vector2D(0, 0),
					new window.Vector2D(2, 1),
					'bullet.png',
					new window.Vector2D(10, 10),
					10
				);

				projectile.update();
				projectile.update();
				projectile.update();

				runner.assertAlmostEqual(projectile.sprite.position.x, 6, 0.01);
				runner.assertAlmostEqual(projectile.sprite.position.y, 3, 0.01);
			});

			runner.it('should handle negative velocity', () => {
				const projectile = new window.Projectile(
					new window.Vector2D(100, 100),
					new window.Vector2D(-5, -3),
					'bullet.png',
					new window.Vector2D(10, 10),
					10
				);

				projectile.update();

				runner.assertAlmostEqual(projectile.sprite.position.x, 95, 0.01);
				runner.assertAlmostEqual(projectile.sprite.position.y, 97, 0.01);
			});

			runner.it('should maintain rotation during movement', () => {
				const projectile = new window.Projectile(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 0),
					'bullet.png',
					new window.Vector2D(10, 10),
					10
				);

				const initialRotation = projectile.sprite.rotation;
				projectile.update();
				projectile.update();

				runner.assertAlmostEqual(projectile.sprite.rotation, initialRotation, 0.01);
			});
		});

		runner.describe('Projectile - Collision Response', () => {
			runner.it('should return default values for onHitPlayer', () => {
				const projectile = new window.Projectile(
					new window.Vector2D(0, 0),
					new window.Vector2D(1, 0),
					'bullet.png',
					new window.Vector2D(10, 10),
					15
				);

				const result = projectile.onHitPlayer();

				runner.assertEqual(result.damage, 0);
				runner.assertEqual(result.sound, null);
				runner.assertEqual(result.volume, 0);
				runner.assertEqual(result.particleColor, null);
			});
		});

			// Render results
			runner.render();
		}

		// Run tests when modules are ready
		window.addEventListener('modulesReady', runAllTests);

		// Fallback: also try running after a short delay if event already fired
		window.addEventListener('DOMContentLoaded', () => {
			setTimeout(() => {
				if (window.modulesLoaded && document.getElementById('results').children.length === 0) {
					runAllTests();
				}
			}, 100);
		});
	</script>
</body>
</html>
